name: Unsigned release bundle

on:
  push:
    branches: [release-bundle-0.1.0]

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -ntp -Prelease-preparation clean verify
      - run: python3 scripts/assemble_unsigned_bundle.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: datamask4j-0.1.0-unsigned
          path: target/datamask4j-0.1.0-unsigned.zip
          if-no-files-found: error
